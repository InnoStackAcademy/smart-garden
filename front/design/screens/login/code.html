<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>BioSync | Acceso</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#006948",
                        "primary-container": "#00855d",
                        "background": "#f7f9fb",
                        "on-surface": "#191c1e",
                        "surface-container-low": "#f2f4f6",
                    },
                    fontFamily: {
                        "headline": ["Manrope"],
                        "body": ["Inter"],
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        h1, h2, h3 { font-family: 'Manrope', sans-serif; }
        .glass-card {
            backdrop-filter: blur(20px);
            background-color: rgba(255, 255, 255, 0.7);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center relative overflow-hidden">
    <!-- Background Image -->
    <img src="https://lh3.googleusercontent.com/aida-public/AB6AXuBOkY3QpLgMTPb-lQ2YFZZtJfkAam6NgKhsiOebLWSXmSuwPqNKwnblMrnDIbxBjgPjO0Av6Zg_ALMqCP04_vS4jo5Ko4VCfEtDz6aCxJkilRpCnWl5Tk3bpwqRu4H91HjlNqO__p_7xdHX9qffYAxXMyjxXFXQonoAUsGDqUMclOlxTEOf8E-OSGAkEVenWhmVz08JD2DLqKAzXTa7NDhAP9RD5Dxb9VLKMqJX2jU4gXn2JH86oHwPUGsR2KLdOOZiO02XZOG4Fj8" 
         class="absolute inset-0 w-full h-full object-cover" alt="Greenhouse Background">
    <div class="absolute inset-0 bg-primary/20 backdrop-blur-sm"></div>

    <!-- Login Card -->
    <div class="relative z-10 w-full max-w-md p-10 rounded-[2.5rem] glass-card shadow-2xl mx-4">
        <div class="flex flex-col items-center mb-10">
            <div class="w-16 h-16 bg-primary rounded-2xl flex items-center justify-center text-white mb-4 shadow-lg">
                <span class="material-symbols-outlined text-4xl">potted_plant</span>
            </div>
            <h1 class="text-3xl font-black text-primary tracking-tight">BioSync</h1>
            <p class="text-[10px] uppercase tracking-[0.2em] font-bold text-slate-500 mt-1">Digital Greenhouse Access</p>
        </div>

        <form class="space-y-6">
            <div>
                <label class="block text-[11px] font-bold uppercase tracking-widest text-slate-500 mb-2 ml-1">Email Address</label>
                <input type="email" class="w-full bg-white/50 border-none rounded-2xl p-4 focus:ring-2 focus:ring-primary/20 transition-all outline-none" placeholder="admin@biosync.io">
            </div>
            <div>
                <div class="flex justify-between items-center mb-2 ml-1">
                    <label class="block text-[11px] font-bold uppercase tracking-widest text-slate-500">Password</label>
                    <a href="#" class="text-[11px] font-bold text-primary hover:underline">Forgot?</a>
                </div>
                <input type="password" class="w-full bg-white/50 border-none rounded-2xl p-4 focus:ring-2 focus:ring-primary/20 transition-all outline-none" value="••••••••">
            </div>

            <button type="button" onclick="location.href='../dashboard/code.html'" class="w-full bg-primary text-white py-4 rounded-2xl font-bold font-headline shadow-lg hover:opacity-90 transition-all active:scale-[0.98] mt-4">
                Enter Dashboard
            </button>
        </form>

        <div class="mt-10 pt-8 border-t border-slate-200 flex flex-col items-center gap-4">
            <p class="text-xs text-slate-400">Or continue with</p>
            <button class="w-full bg-white text-slate-700 py-3 rounded-2xl font-bold text-sm flex items-center justify-center gap-3 border border-slate-100 hover:bg-slate-50 transition-all">
                <img src="https://www.google.com/favicon.ico" class="w-4 h-4" alt="Google">
                Sync with Google
            </button>
        </div>
    </div>
</body>
</html>
