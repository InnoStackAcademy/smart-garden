# docker-compose.pi.yml
# Este archivo vive en la Pi: /home/admin/stacks/smart-garden/
# Solo pull + up, nunca build local.

services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    restart: unless-stopped

  mongo:
    image: mongo:4.4.18
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/innostackacademy/smart-garden/backend:latest}
    ports:
      - "3000:3000"
    env_file: .env
    depends_on:
      - mongo
      - mosquitto
    restart: unless-stopped

volumes:
  mongo_data:
  mosquitto_data:
  mosquitto_log:
